services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: marksuser
      POSTGRES_PASSWORD: markspass
      POSTGRES_DB: marksdb
    ports:
      - "5432:5432"
    volumes:
      # Pre-seed script (runs only the first time the data directory is created)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Persist DB data across container recreation
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: marksdb
      DB_USER: marksuser
      DB_PASSWORD: markspass
    ports:
      - "5001:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001
    depends_on:
      - backend
    ports:
      # nginx listens on 80 in the container; expose on 8080 on your laptop
      - "8081:80"

  automark:
    build: ./automark
    depends_on:
      - backend
      - db
    profiles:
      - debug

volumes:
  db_data: